name: Run Trading Bot

on:
  repository_dispatch:
    types: [run-bot-event]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 【關鍵設定 1】啟用 pip 快取，會根據 requirements.txt 自動辨識
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 【關鍵設定 2】加上 --cache-dir，確保會使用快取資料夾
          pip install -r requirements.txt --cache-dir ~/.cache/pip

      - name: Run bot script
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: |
          python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state_swap.json market_log_swap.csv
          git commit -m "Auto-update bot state and logs [skip ci]" || echo "No changes to commit"
          git push
